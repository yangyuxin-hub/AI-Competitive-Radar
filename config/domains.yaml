# 行业域配置 — 通过 DOMAIN 环境变量选择
# 用法:DOMAIN=pm python -m src.graph
# 默认 ai_coding。换行业 = 新增一个 entry,无需改代码。
domains:
  ai_coding:
    name: "AI 编程工具"
    en_name: "AI coding assistant"   # 检索消歧用:产品名是英文时拼到 query 里锚定品类
    sample_path: "data/sample_sources.json"
    target_product: "Cursor"
    competitors: ["Windsurf", "GitHubCopilot"]
    analysis_focus: ["代码补全体验"]
    analysis_purpose: "学习竞品优点,优化 Cursor 的产品策略"

  pm:
    name: "项目协作工具"
    en_name: "project management"
    sample_path: "data/sample_sources_pm.json"
    target_product: "Notion"
    competitors: ["Asana", "Linear"]
    analysis_focus: ["团队任务管理体验"]
    analysis_purpose: "学习竞品优势,优化 Notion 的项目协作能力"

  # 以下行业无 sample_path → 仅走实时采集(DDG/官网),展示"可换行业可换竞品"
  ai_assistant:
    name: "AI 对话助手"
    en_name: "AI assistant chatbot"
    target_product: "ChatGPT"
    competitors: ["Claude", "Gemini"]
    analysis_focus: ["通用对话与推理体验"]
    analysis_purpose: "对比头部大模型助手的体验差距,辅助选型"

  design:
    name: "设计协作工具"
    en_name: "design tool"
    target_product: "Figma"
    competitors: ["Sketch", "Canva"]
    analysis_focus: ["界面设计协作体验"]
    analysis_purpose: "对比设计工具的协作与易用性,辅助团队选型"

  baas:
    name: "后端即服务(BaaS)"
    en_name: "backend as a service"
    target_product: "Supabase"
    competitors: ["Firebase", "Appwrite"]
    analysis_focus: ["后端开发体验与定价"]
    analysis_purpose: "对比 BaaS 平台的开发体验与成本,辅助技术选型"
