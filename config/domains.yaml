# 行业域配置 — 通过 DOMAIN 环境变量选择
# 用法:DOMAIN=pm python -m src.graph
# 默认 ai_coding。换行业 = 新增一个 entry,无需改代码。
domains:
  ai_coding:
    name: "AI 编程工具"
    en_name: "AI coding assistant"   # 检索消歧用:产品名是英文时拼到 query 里锚定品类
    sample_path: "data/sample_sources.json"
    target_product: "Cursor"
    competitors: ["ClaudeCode", "Trae"]
    analysis_focus: ["代码补全体验"]
    analysis_purpose: "学习竞品优点,优化 Cursor 的产品策略"

  pm:
    name: "项目协作工具"
    en_name: "project management"
    sample_path: "data/sample_sources_pm.json"
    target_product: "Notion"
    competitors: ["Linear", "飞书项目"]
    analysis_focus: ["团队任务管理体验"]
    analysis_purpose: "学习竞品优势,优化 Notion 的项目协作能力"

  # 以下行业无 sample_path → 仅走实时采集(DDG/官网),展示"可换行业可换竞品"
  ai_assistant:
    name: "AI 对话助手"
    en_name: "AI assistant chatbot"
    target_product: "ChatGPT"
    competitors: ["Gemini", "DeepSeek"]
    analysis_focus: ["通用对话与推理体验"]
    analysis_purpose: "对比头部大模型助手的体验差距,辅助选型"

  design:
    name: "设计协作工具"
    en_name: "design tool"
    target_product: "Figma"
    competitors: ["Canva", "即时设计"]
    analysis_focus: ["界面设计协作体验"]
    analysis_purpose: "对比设计工具的协作与易用性,辅助团队选型"

  baas:
    name: "后端即服务(BaaS)"
    en_name: "backend as a service"
    target_product: "Supabase"
    competitors: ["Firebase", "Appwrite"]
    analysis_focus: ["后端开发体验与定价"]
    analysis_purpose: "对比 BaaS 平台的开发体验与成本,辅助技术选型"

  ai_image:
    name: "AI 图像生成"
    en_name: "AI image generation"
    target_product: "Midjourney"
    competitors: ["NanoBanana", "即梦AI"]
    analysis_focus: ["图像生成质量与创作体验"]
    analysis_purpose: "对比主流文生图工具的质量与易用性,辅助创作者选型"

  ai_video:
    name: "AI 视频生成"
    en_name: "AI video generation"
    target_product: "Sora"
    competitors: ["Veo3", "即梦AI"]
    analysis_focus: ["文生视频效果与可控性"]
    analysis_purpose: "对比主流文生视频工具的效果与可控性,辅助创作者选型"

  ai_music:
    name: "AI 音乐生成"
    en_name: "AI music generation"
    target_product: "Suno"
    competitors: ["Udio", "Mureka"]
    analysis_focus: ["AI 音乐生成质量与易用性"]
    analysis_purpose: "对比 AI 作曲工具的质量与易用性,辅助创作者选型"

  ai_search:
    name: "AI 搜索"
    en_name: "AI search engine"
    target_product: "Perplexity"
    competitors: ["Metaso", "ChatGPTSearch"]
    analysis_focus: ["AI 搜索准确性与体验"]
    analysis_purpose: "对比 AI 搜索引擎的准确性与体验,辅助选型"
