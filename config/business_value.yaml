# 业务价值「vs 人工」对比的人工基线
# 说明:人工侧为行业经验**估算**(非实测),用于与系统实测指标对比;团队可按实际调整。
#       系统侧所有指标均来自本次运行的真实数据(耗时/证据/覆盖率/溯源率)。
manual:
  hours_per_analysis: 8          # 3 产品 × 单焦点一次完整竞品分析的人工工时(估)
  source_types: 3                # 人工通常覆盖的信息源类型数(官网 + 少量评测/社区)
  evidence_items: 25             # 人工手动记录整理的证据条数(估)
  traceability_desc: "弱·不统一"   # 人工结论的溯源:常无逐条出处、口径不一
  consistency_desc: "因人而异"     # 人工输出结构/字段一致性

note: "人工基线为行业经验估算(非实测);系统侧均为本次运行实测值。可在 config/business_value.yaml 调整基线。"
